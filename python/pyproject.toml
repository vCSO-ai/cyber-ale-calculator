[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-ale-calculator"
version = "1.0.0"
description = "Calculate Annual Loss Expectancy (ALE), Single Loss Expectancy (SLE), and risk reduction ROI for cybersecurity investments"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "vCSO.ai", email = "contact@vcso.ai"}]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
keywords = ["cybersecurity", "risk", "ale", "sle", "aro", "fair", "risk-quantification", "annual-loss-expectancy"]

[project.urls]
Homepage = "https://vcso.ai/learn/annual-loss-expectancy-calculator/"
Documentation = "https://vcso.ai/learn/how-to-measure-cybersecurity-roi/"
Repository = "https://github.com/vCSO-ai/cyber-ale-calculator"

[tool.setuptools.packages.find]
where = ["src"]
